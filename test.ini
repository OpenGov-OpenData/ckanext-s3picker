[DEFAULT]
debug = false
smtp_server = localhost
error_email_from = paste@localhost

[server:main]
use = egg:Paste#http
host = 0.0.0.0
port = 5000

[app:main]
use = config:../ckan/test-core.ini
ckan.plugins = cloudstorage s3picker

ckanext.cloudstorage.driver = S3
ckanext.cloudstorage.container_name = uploads-bucket
ckanext.cloudstorage.driver_options = {"key": "testing", "secret": "testing", "region": "us-east-1"}

ckanext.s3picker.default_bucket = lidar-test-bucket
ckanext.s3picker.catalogs = {"county-a": {"prefix": "county-a/2024/", "title": "County A 2024 LiDAR"}, "restricted": {"prefix": "restricted/", "private": true}}

# Logging configuration
[loggers]
keys = root, ckan, sqlalchemy

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_ckan]
qualname = ckan
handlers =
level = INFO

[logger_sqlalchemy]
handlers =
qualname = sqlalchemy.engine
level = WARN

[handler_console]
class = StreamHandler
args = (sys.stdout,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
